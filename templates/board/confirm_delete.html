{% extends "base.html" %}
{% block title %}Supprimer {{ post.title }}{% endblock %}
{% block content %}
<div class="card form-card">
  <h1>Supprimer « {{ post.title }} » ?</h1>
  <form method="post" class="btn-row">{% csrf_token %}
    <button class="btn btn-danger" type="submit">Supprimer</button>
    <a class="btn btn-ghost" href="{{ post.get_absolute_url }}">Annuler</a>
  </form>
</div>
{% endblock %}
