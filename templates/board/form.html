{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card form-card">
  <h1>{{ title }}</h1>
  <form method="post">{% csrf_token %}
    {% include "includes/form_fields.html" %}
    <div class="btn-row">
      <button class="btn" type="submit">Publier</button>
      <a class="btn btn-ghost" href="{% if post %}{{ post.get_absolute_url }}{% else %}{% url 'board:list' %}{% endif %}">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
