{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="card form-card" style="max-width:440px;margin:20px auto">
  <h1>Connexion</h1>
  <form method="post">{% csrf_token %}
    {% include "includes/form_fields.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn" type="submit" style="width:100%">Se connecter</button>
  </form>
  <p class="small" style="margin-top:16px"><a href="{% url 'accounts:password_reset' %}">Mot de passe oublié ?</a></p>
  <p class="small muted">Pas encore de compte ? <a href="{% url 'accounts:signup' %}">Inscrivez-vous</a>.</p>
</div>
{% endblock %}
