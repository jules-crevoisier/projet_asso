{% extends "base.html" %}
{% block title %}Supprimer {{ event.title }}{% endblock %}
{% block content %}
<div class="card form-card">
  <h1>Supprimer « {{ event.title }} » ?</h1>
  <p>L'événement disparaîtra du calendrier partagé, avec ses participations et messages.</p>
  <form method="post" class="btn-row">{% csrf_token %}
    <button class="btn btn-danger" type="submit">Supprimer</button>
    <a class="btn btn-ghost" href="{{ event.get_absolute_url }}">Annuler</a>
  </form>
</div>
{% endblock %}
