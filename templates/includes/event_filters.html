<form method="get" class="filters">
  {% for key, value in extra_hidden %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endfor %}
  <select name="association" onchange="this.form.submit()" aria-label="Association">
    <option value="">Toutes les associations</option>
    {% for a in filters.associations %}<option value="{{ a.slug }}" {% if a.slug == filters.association %}selected{% endif %}>{{ a.name }}</option>{% endfor %}
  </select>
  <select name="theme" onchange="this.form.submit()" aria-label="Thème">
    <option value="">Tous les thèmes</option>
    {% for value, label in filters.categories %}<option value="{{ value }}" {% if value == filters.theme %}selected{% endif %}>{{ label }}</option>{% endfor %}
  </select>
  {% if user.is_authenticated %}
    <label class="check"><input type="checkbox" name="mes" value="1" {% if filters.mes %}checked{% endif %} onchange="this.form.submit()"> Mes associations uniquement</label>
  {% endif %}
  <noscript><button class="btn btn-secondary btn-sm">Filtrer</button></noscript>
</form>
